name: iOS Build & Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      # Escribe la API key de App Store Connect
      # Xcode usará esta key para descargar/crear el certificado automaticamente
      # sin necesidad de importar ningun .p12 manualmente
      - name: Write App Store Connect API Key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8
          echo "Key file OK:"
          head -1 ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8

      # Xcode gestiona el certificado y perfil automaticamente via API
      # No se necesita P12 ni keychain manual
      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=C59HC2JBRC \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=2.0.1 \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPLE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_ISSUER_ID }} \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/output \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPLE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Upload to TestFlight via App Store Connect API
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/output/App.ipa \
            -t ios \
            --apiKey ${{ secrets.APPLE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPLE_ISSUER_ID }}
